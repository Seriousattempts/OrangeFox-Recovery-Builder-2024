name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - 12.1
          - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/whkoo/device_ums512_1h10'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device path'
        required: true
        default: 'device/sprd/ums512_1h10'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'ums512_1h10'
      BUILD_TARGET:
        description: 'Build target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

jobs:
  build:
    name: Build OrangeFox for ${{ github.event.inputs.DEVICE_NAME }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DATE: $(date +%Y%m%d)

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip \
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
        x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Initialize OrangeFox
      run: |
        mkdir -p OrangeFox
        cd OrangeFox
        repo init -u https://gitlab.com/OrangeFox/sync.git -b fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Sync Repository
      run: |
        cd OrangeFox
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd OrangeFox/device
        git clone ${{ github.event.inputs.DEVICE_TREE }} \
          -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
          ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(cd ${{ github.event.inputs.DEVICE_PATH }} && git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Setup Build Environment
      run: |
        cd OrangeFox
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng

    - name: Build Recovery
      run: |
        cd OrangeFox
        mka ${{ github.event.inputs.BUILD_TARGET }}image 2>&1 | tee build.log

    - name: Locate and Verify Artifacts
      run: |
        cd OrangeFox/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        
        if [ -f recovery.img ]; then
          echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
          echo "FILE_PATH=$(pwd)" >> $GITHUB_ENV
          echo "RECOVERY_NAME=OrangeFox_${{ github.event.inputs.DEVICE_NAME }}_${{ env.BUILD_DATE }}.img" >> $GITHUB_ENV
          mv recovery.img ${{ env.RECOVERY_NAME }}
          md5sum ${{ env.RECOVERY_NAME }} | cut -d ' ' -f1 > ${{ env.RECOVERY_NAME }}.md5
        else
          echo "::error::Recovery image not found in output directory"
          exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        path: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_NAME }}
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_NAME }}.md5

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: |
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_NAME }}
          ${{ env.FILE_PATH }}/${{ env.RECOVERY_NAME }}.md5
        tag_name: ofox-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        name: OrangeFox ${{ github.event.inputs.MANIFEST_BRANCH }} for ${{ github.event.inputs.DEVICE_NAME }}
        body: |
          ### Build Details
          - **Device:** ${{ github.event.inputs.DEVICE_NAME }}
          - **Branch:** ${{ github.event.inputs.MANIFEST_BRANCH }}
          - **Build Date:** ${{ env.BUILD_DATE }}
          - **Commit ID:** ${{ env.COMMIT_ID }}
